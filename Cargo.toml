[package]
name = "brei"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
crossbeam-channel = "0.5.13"
ctrlc = { version = "3.5.2", features = ["termination"] }
log = { version = "0.4.35", features = ["kv"] }
md5 = "0.8.1"
serde = { version = "1.0.206", features = ["derive"] }
serde_json = "1.0.122"
shlex = "2.0.1"
tempfile = "3.27.0"
toml = "0.8.19"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
