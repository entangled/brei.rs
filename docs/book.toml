[book]
title = "Brei.rs"
authors = ["Johan Hidding"]
language = "en"

[preprocessor.strip-frontmatter]
command = "python3 ../scripts/mdbook_strip_frontmatter.py"

[preprocessor.eval]
command = "python3 ../scripts/mdbook_eval.py"
setup = "cargo build --quiet --bin brei"
path = ["../target/debug"]
copy = ["../examples"]

[output.html]
additional-css = ["theme/eval.css"]
site-url = "/brei.rs/"
git-repository-url = "https://github.com/entangled/brei.rs"
edit-url-template = "https://github.com/entangled/brei.rs/edit/main/docs/{path}"

[output.html.fold]
enable = true
level = 0
