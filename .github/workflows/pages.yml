# Build the book, with the coverage report and the output of the examples,
# and publish it on https://entangled.github.io/brei.rs.
name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2

      # The tests need `python`, and the custom runner example needs `lua`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Lua and mdBook
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Install `brei` separately, because the coverage run rebuilds `target/debug/brei`.
      - name: Install Brei
        run: cargo install --path . --locked

      - name: Measure coverage
        run: brei coverage

      - name: Build the book
        run: mdbook build docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
