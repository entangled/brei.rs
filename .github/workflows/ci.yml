# Run the tests, clippy and the documentation build on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The tests run Unix tools like `echo` and `tr`. On Windows, Git Bash puts these on the path.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Some tests run Python scripts, and one example needs `lua` (it is skipped without).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Lua
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install Lua
        if: runner.os == 'macOS'
        run: brew install lua

      - name: Test
        run: cargo test --locked --no-fail-fast

      - name: Clippy
        run: cargo clippy --locked --all-targets

      - name: Documentation
        if: runner.os == 'Linux'
        run: cargo doc --locked --no-deps

  # Check that the crate builds with the oldest Rust it claims to support (`rust-version`).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets
